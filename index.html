<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Cat Social</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 class="title">Cat Social 🐱</h1>
        <nav class="header__menu">
            <ul class="header__links-list">
                <li class="header__links-list-item">
                    <a class="header__link" href="#">Главная</a>
                </li>
                <li class="header__links-list-item">
                    <a class="header__link" href="#">Мои посты</a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="layout">
        <aside class="post_maker">
            <div class="form">
                <h2 class="form__title">🐱 Создать новый пост</h2>
                <div class="text_wrapper">
                    <textarea class="text" placeholder="Что думает ваш котик?"></textarea>
                    <span class="counter"></span>
                </div>
                <div class="form__field">
                    <label class="form__label">Имя котика</label>
                    <input class="cat_name" placeholder="Как зовут вашего котика?">
                </div>
                <div class="form__field">
                    <label class="form__label">Аватар котика</label>
                    <select class="cat_avatar"></select>
                </div>
                <div class="form__field">
                    <label class="form__label">Фото котика</label>
                    <label for="cat_photo" class="cat_photo_label">
                        <span class="cat_photo_name"></span>
                        <span>📷 Нажмите, чтобы загрузить фото</span>
                        <span class="cat_photo_hint">JPG, PNG до 10 МБ</span>
                    </label>
                    <input type="file" class="cat_photo" id="cat_photo" accept="image/*">
                </div>
                <div class="form__buttons">
                    <button class="button button--primary">🐾 Опубликовать</button>
                    <button class="button button--secondary">Очистить</button>
                </div>
                <button class="load_server_btn">Загрузить посты с сервера</button>
            </div>

            <div class="filter">
                <h3 class="filter__title">🐱 Фильтры</h3>
                <div class="form__field">
                    <label class="form__label">Котики</label>
                    <select class="filter_cat">
                        <option>Все котики</option>
                    </select>
                </div>
                <div class="filter__buttons">
                    <button class="apply_filter_btn button button--primary">Применить</button>
                    <button class="reset_filter_btn button button--secondary">Сбросить</button>
                </div>
            </div>

            <div class="sort">
                <h3 class="sort__title">Сортировка</h3>
                <div class="sort__buttons">
                    <button class="sort_date_new button button--sort">По дате (новые)</button>
                    <button class="sort_date_old button button--sort">По дате (старые)</button>
                    <button class="sort_likes button button--sort">По лайкам</button>
                </div>
            </div>
        </aside>

        <div class="posts_list">
            <div class="post"></div>
            <button class="load_more_btn">Загрузить еще</button>
        </div>
    </div>
    <div class="modal" id="modal_delete">
        <div class="modal__content">
            <p>Точно удалить этот пост?</p>
            <div class="modal__buttons">
                <button class="modal__confirm">Удалить</button>
                <button class="modal__cancel">Отмена</button>
            </div>
        </div>
    </div>
    <div class="modal" id="modal_edit">
        <div class="modal__content">
            <p>Редактировать пост</p>
            <textarea class="modal__textarea"></textarea>
            <div class="modal__buttons">
                <button class="modal__save">Сохранить</button>
                <button class="modal__cancel modal__cancel--edit">Отмена</button>
            </div>
        </div>
    </div>
    <script type="module" src="main.ts"></script>
</body>
</html>
